# Cloudflare Worker 部署配置
# 在 deploy/ 目录下执行：npx wrangler deploy
#
# 注意：这是一个“有代码入口”的 Worker，不是 Static Assets Worker。
# 不要把 worker.js 当成静态文件上传到 Pages/Assets。

name = "vu-checkin-proxy"
main = "worker.js"
compatibility_date = "2026-11-19"
workers_dev = true

# 绑定到 dornhub 的 /checkin-api 路径。
# 需要 dornhub.eu.org 已托管在同一个 Cloudflare 账号下。
routes = [
  { pattern = "dornhub.eu.org/checkin-api*", zone_name = "dornhub.eu.org" }
]
