<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VU Captcha</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #f4efe9;
      color: #2d1616;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 26px;
      background:
        radial-gradient(circle at 90% 0%, rgba(165, 21, 21, 0.10), rgba(165, 21, 21, 0) 42%),
        #f4efe9;
    }
    .captcha {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .mark {
      width: 50px;
      height: 50px;
      margin: 0 auto 14px;
      border-radius: 16px;
      background: linear-gradient(145deg, #a51515, #6f0c0c);
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 50px;
      box-shadow: 0 12px 26px rgba(165, 21, 21, 0.24);
    }
    h1 {
      margin: 0;
      font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: #3b1d1d;
    }
    .sub {
      margin-top: 5px;
      font-size: 10px;
      letter-spacing: 1.4px;
      color: #a98a82;
    }
    body.embed {
      min-height: 0;
      padding: 0;
      background: transparent;
      display: block;
    }
    body.embed .mark,
    body.embed h1,
    body.embed .sub {
      display: none;
    }
    body.embed .captcha {
      max-width: none;
      width: 100%;
    }
    body.embed .widget {
      margin-top: 0;
      min-height: 65px;
    }
    body.embed .status {
      margin-top: 6px;
      font-size: 11px;
    }
    body.embed .error {
      margin-top: 6px;
      padding: 7px 9px;
    }
    body.embed .refresh {
      margin-top: 6px;
      height: 30px;
      line-height: 30px;
      font-size: 11px;
    }
    .widget {
      margin-top: 24px;
      min-height: 70px;
      display: flex;
      justify-content: center;
    }
    .status {
      margin-top: 14px;
      font-size: 12px;
      line-height: 1.6;
      color: #7b5b55;
      min-height: 20px;
    }
    .error {
      margin-top: 12px;
      padding: 11px 12px;
      border-radius: 9px;
      background: rgba(217, 72, 15, 0.08);
      border: 1px solid rgba(217, 72, 15, 0.18);
      color: #b4432a;
      font-size: 12px;
      line-height: 1.6;
      display: none;
    }
    .refresh {
      margin-top: 12px;
      height: 38px;
      padding: 0 20px;
      border: 0;
      border-radius: 8px;
      background: #a51515;
      color: #fff;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="captcha">
    <div class="mark">Va</div>
    <h1>人机验证</h1>
    <div class="sub">CLOUDFLARE TURNSTILE</div>
    <div class="widget" id="widget"></div>
    <div class="status" id="status">请等待人机验证完成</div>
    <div class="error" id="error"></div>
    <button class="refresh" id="refresh" onclick="location.reload()">刷新本页面</button>
  </div>

  <script src="./uni.webview.js"></script>
  <script>
    (function () {
      'use strict';

      var params = new URLSearchParams(location.search);
      var sitekey = params.get('sitekey') || '0x4AAAAAAC2E9TsjP-02HPpE';
      var action = params.get('action') || 'auth';
      var theme = params.get('theme') || 'light';
      var language = params.get('language') || 'zh-cn';
      var nonce = params.get('nonce') || '';
      var embed = params.get('embed') === '1';
      var done = false;

      if (embed) {
        document.body.classList.add('embed');
      }

      function setStatus(text) {
        document.getElementById('status').textContent = text;
      }

      function showError(text) {
        var el = document.getElementById('error');
        el.style.display = 'block';
        el.textContent = text;
        document.getElementById('refresh').style.display = 'inline-block';
      }

      function post(result) {
        if (done) return;
        done = true;
        result.action = action;
        result.nonce = nonce;

        var inIframe = false;
        try {
          inIframe = window.parent && window.parent !== window;
        } catch (e) {}

        if (inIframe) {
          window.parent.postMessage(result, '*');
          return;
        }
        if (window.uni && typeof window.uni.postMessage === 'function') {
          window.uni.postMessage({ data: result });
          return;
        }
        try {
          window.parent.postMessage(result, '*');
        } catch (e) {}
      }

      function fail(message) {
        setStatus('验证失败');
        showError(message);
        post({ type: 'VU_CAPTCHA_ERROR', message: message });
      }

      function loadTurnstile() {
        return new Promise(function (resolve, reject) {
          if (window.turnstile) return resolve();
          var s = document.createElement('script');
          s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
          s.async = true;
          s.defer = true;
          s.onload = function () { resolve(); };
          s.onerror = function () { reject(new Error('Turnstile 脚本加载失败')); };
          document.head.appendChild(s);
        });
      }

      loadTurnstile()
        .then(function () {
          if (!window.turnstile) throw new Error('Turnstile 未就绪');
          window.turnstile.render(document.getElementById('widget'), {
            sitekey: sitekey,
            action: action,
            theme: theme,
            language: language,
            callback: function (token) {
              setStatus('验证通过，正在返回…');
              post({ type: 'VU_CAPTCHA_SUCCESS', token: token });
            },
            'error-callback': function (code) {
              fail('人机验证失败（' + (code || 'unknown') + '）');
            },
            'expired-callback': function () {
              setStatus('验证已过期，请刷新页面');
              showError('验证已过期，请刷新页面后重试');
            },
            'timeout-callback': function () {
              setStatus('验证超时，请刷新页面');
              showError('验证超时，请刷新页面后重试');
            }
          });
        })
        .catch(function (err) {
          fail(err && err.message ? err.message : '人机验证加载失败');
        });
    })();
  </script>
</body>
</html>
