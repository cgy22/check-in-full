<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VU Bridge</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #f4efe9;
      color: #2d1616;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background:
        radial-gradient(circle at 90% 0%, rgba(165, 21, 21, 0.10), rgba(165, 21, 21, 0) 42%),
        radial-gradient(circle at 0% 100%, rgba(255, 181, 0, 0.08), rgba(255, 181, 0, 0) 40%),
        #f4efe9;
    }
    .bridge {
      width: 100%;
      max-width: 340px;
      text-align: center;
    }
    .mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 16px;
      border-radius: 17px;
      background: linear-gradient(145deg, #a51515, #6f0c0c);
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      font-weight: 700;
      line-height: 54px;
      box-shadow: 0 12px 26px rgba(165, 21, 21, 0.25);
    }
    h1 {
      margin: 0;
      font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
      font-size: 21px;
      letter-spacing: 3px;
      color: #3b1d1d;
    }
    .sub {
      margin-top: 6px;
      font-size: 10px;
      letter-spacing: 1.6px;
      color: #a98a82;
    }
    .status {
      margin-top: 28px;
      font-size: 13px;
      color: #7b5b55;
      line-height: 1.7;
      min-height: 22px;
    }
    .spinner {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-top: 18px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #a51515;
      opacity: 0.3;
      animation: pulse 1.1s cubic-bezier(0.05, 0.7, 0.1, 1) infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.14s; }
    .dot:nth-child(3) { animation-delay: 0.28s; }
    .error {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(217, 72, 15, 0.08);
      border: 1px solid rgba(217, 72, 15, 0.18);
      color: #b4432a;
      font-size: 12px;
      line-height: 1.6;
      display: none;
      word-break: break-word;
    }
    .retry {
      margin-top: 14px;
      height: 38px;
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      background: #a51515;
      color: #fff;
      font-size: 13px;
      display: none;
    }
    body.bridge-embed {
      background: #f4efe9;
    }
    body.bridge-embed .bridge {
      display: none;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.25; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }
  </style>
</head>
<body>
  <div class="bridge">
    <div class="mark">Va</div>
    <h1>瓦莱希雅大学</h1>
    <div class="sub">SECURE BRIDGE</div>
    <div class="status" id="status">正在连接校园服务器…</div>
    <div class="spinner" id="spinner">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="error" id="error"></div>
    <button class="retry" id="retry" onclick="location.reload()">重试</button>
  </div>

  <script src="./uni.webview.js"></script>
  <script>
    (function () {
      'use strict';

      var params = new URLSearchParams(location.search);
      var nonce = params.get('nonce') || '';
      var rawPayload = params.get('payload') || '';
      var embed = params.get('embed') === '1';
      var done = false;
      if (embed) document.body.classList.add('bridge-embed');

      // PHP 被服务器反爬拦截时，填 Cloudflare Worker 地址：
      // 例如 https://vu-checkin-proxy.xxx.workers.dev
      // 或 https://dornhub.eu.org/checkin-api
      var WORKER_PROXY_URL = 'https://checkin-api.dornhub.eu.org';
      // 使用 .private/proxy.php（已被服务器反爬放行的路径）
      var PHP_PROXY_URL = '../proxy.php';

      function setStatus(text) {
        document.getElementById('status').textContent = text;
      }

      function showError(text) {
        var el = document.getElementById('error');
        el.style.display = 'block';
        el.textContent = text;
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('retry').style.display = 'inline-block';
      }

      function postResult(result) {
        if (done) return;
        done = true;
        result.type = 'VU_BRIDGE_RESULT';
        result.nonce = nonce;

        var inIframe = false;
        try {
          inIframe = window.parent && window.parent !== window;
        } catch (e) {}

        if (inIframe) {
          window.parent.postMessage(result, '*');
          return;
        }

        if (window.uni && typeof window.uni.postMessage === 'function') {
          window.uni.postMessage({ data: result });
          return;
        }

        try {
          window.parent.postMessage(result, '*');
        } catch (e) {}
      }

      function fail(message) {
        setStatus('连接失败');
        showError(message);
        postResult({ ok: false, status: 0, data: { message: message } });
      }

      if (!rawPayload) {
        fail('缺少请求参数');
        return;
      }

      var payload;
      try {
        payload = JSON.parse(rawPayload);
      } catch (e) {
        fail('请求参数格式错误');
        return;
      }

      var target;
      try {
        target = new URL(payload.url);
      } catch (e) {
        fail('请求地址不合法');
        return;
      }

      var path = target.pathname + target.search;
      if (!/^\/(auth\/v1|rest\/v1|functions\/v1)\//.test(path)) {
        fail('请求地址不在允许范围内');
        return;
      }

      var method = String(payload.method || 'GET').toUpperCase();
      if (['GET', 'POST', 'PUT', 'PATCH', 'DELETE'].indexOf(method) === -1) {
        fail('请求方法不允许');
        return;
      }

      var headers = {};
      if (payload.header && typeof payload.header === 'object') {
        Object.keys(payload.header).forEach(function (key) {
          var lower = String(key).toLowerCase();
          if (
            ['apikey', 'authorization', 'content-type', 'prefer', 'accept'].indexOf(lower) === -1
          ) {
            return;
          }
          headers[key] = String(payload.header[key]);
        });
      }
      if (!headers['Content-Type'] && !headers['content-type']) {
        headers['Content-Type'] = 'application/json';
      }
      var authValue = '';
      if (payload.header && typeof payload.header === 'object') {
        authValue = payload.header.Authorization || payload.header.authorization || '';
      }
      if (authValue) {
        headers['X-User-Token'] = String(authValue);
      }

      var body;
      if (method !== 'GET' && method !== 'HEAD' && payload.data !== null && payload.data !== undefined) {
        body = JSON.stringify(payload.data);
      }

      function parseProxyResponse(res) {
        var contentType = (res.headers && res.headers.get('content-type')) || '';
        return res.text().then(function (text) {
          var data = null;
          if (text) {
            try {
              data = JSON.parse(text);
            } catch (e) {
              data = text;
            }
          }
          var isJson = contentType.indexOf('application/json') !== -1;
          return {
            ok: res.ok && isJson,
            json: isJson,
            status: res.status,
            data: data
          };
        });
      }

      function requestProxy(base, label) {
        var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
        var timer = setTimeout(function () {
          if (controller) controller.abort();
        }, 30000);
        var sep = base.indexOf('?') === -1 ? '?' : '&';
        var requestUrl = base + sep + 'path=' + encodeURIComponent(path);

        return fetch(requestUrl, {
          method: method,
          headers: headers,
          body: body,
          credentials: 'omit',
          cache: 'no-store',
          signal: controller ? controller.signal : undefined
        })
          .then(function (res) {
            return parseProxyResponse(res).then(function (result) {
              clearTimeout(timer);
              return result;
            });
          })
          .catch(function (err) {
            clearTimeout(timer);
            throw err;
          });
      }

      function handleResult(result, source) {
        if (result.ok) {
          setStatus('连接成功，正在返回…');
        } else {
          var msg;
          if (!result.json) {
            msg = '服务器返回了非 JSON（很可能被反爬挑战拦截）';
          } else {
            msg =
              (result.data && (result.data.message || result.data.msg || result.data.error_description)) ||
              ('HTTP ' + result.status);
          }
          showError(msg);
        }
        postResult(result);
      }

      function requestPrimary() {
        if (!WORKER_PROXY_URL) {
          return requestProxy(PHP_PROXY_URL, 'php').then(function (result) {
            return { result: result, source: 'php' };
          });
        }

        return requestProxy(WORKER_PROXY_URL, 'worker')
          .then(function (result) {
            if (result.ok || result.json) {
              return { result: result, source: 'worker' };
            }
            return requestProxy(PHP_PROXY_URL, 'php').then(function (phpResult) {
              return { result: phpResult, source: 'php' };
            });
          })
          .catch(function () {
            return requestProxy(PHP_PROXY_URL, 'php').then(function (phpResult) {
              return { result: phpResult, source: 'php' };
            });
          });
      }

      requestPrimary()
        .then(function (x) {
          handleResult(x.result, x.source);
        })
        .catch(function (err) {
          var detail = err ? (err.name || 'Error') + ': ' + (err.message || 'unknown') : 'unknown';
          fail('无法连接服务器代理（' + detail + '）');
        });
    })();
  </script>
</body>
</html>
